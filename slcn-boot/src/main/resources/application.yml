spring:
  application:
    name: slcnapp
  datasource:
    url: "${SLCN_POSTGRESQL_URL}"
    username: "${SLCN_POSTGRESQL_USER}"
    password: "${SLCN_POSTGRESQL_PW}"
    driver-class-name: org.postgresql.Driver
  data:
    mongodb:
      uri: "${SLCN_MONGODB_URL}"
      # @Indexed/@CompoundIndex는 이 값이 true일 때만 실제 인덱스로 생성된다. 기본값은 false다.
      auto-index-creation: true
    redis:
      host: "${SLCN_REDIS_URL}"
      port: "${SLCN_REDIS_PORT}"
      password: "${SLCN_REDIS_PW}"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show-sql: false
        use_sql_comments: false
        format_sql: false
    generate-ddl: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  jwt:
    secretKey: "${SLCN_JWT_SECRETKEY}"
    algorithm: "${SLCN_JWT_ALGORITHM:HS512}"
    accessAudiences: "${SLCN_JWT_ACCESS_AUDIENCES:slcn-platform}"
    refreshAudience: "${SLCN_JWT_REFRESH_AUDIENCE:slcn-auth-refresh}"
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB
      # 미설정 시 Spring Boot 기본값 10MB가 요청 전체에 적용되어 다중 업로드가 첫 파일에서 막힌다.
      # 파일당 제한(10MB)은 그대로 두고 요청 총량만 연다.
      max-request-size: 60MB

logging:
  level:
    org:
      hibernate: info

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
slcn:
  domain: "${SLCN_DOMAIN_LIST:http://localhost:9090}"
  upload:
    # local 프로바이더의 기준 디렉터리이자, R2 백필의 원본 위치다.
    path: "${SLCN_UPLOAD_PATH}"
  storage:
    # local | r2. r2가 아니면 로컬 디스크에 저장하고 바이트를 직접 서빙한다.
    provider: "${SLCN_STORAGE_PROVIDER:local}"
    # presigned URL 만료. 만료는 요청 시작 시점에만 검사되므로 짧게 잡아도 대용량 전송이 끊기지 않는다.
    presigned-ttl-seconds: "${SLCN_STORAGE_PRESIGNED_TTL:300}"
    r2:
      endpoint: "${SLCN_R2_ENDPOINT:}"
      region: "${SLCN_R2_REGION:auto}"
      bucket: "${SLCN_R2_BUCKET:}"
      access-key: "${SLCN_R2_ACCESS_KEY:}"
      secret-key: "${SLCN_R2_SECRET_KEY:}"
    migration:
      # 기존 로컬 파일을 오브젝트 스토리지로 옮긴다. 배포 1회만 켜고 다시 내린다.
      enabled: "${SLCN_STORAGE_MIGRATION_ENABLED:false}"
      batch-size: "${SLCN_STORAGE_MIGRATION_BATCH_SIZE:100}"

cookie:
  expire:
    time: 1209600
  secure: true
  sameSite: Lax
login:
  fail:
    limit:
      count: 5
  limit:
    clear:
      time: 300

---
spring:
  config:
    activate:
      on-profile: dev


cookie:
  secure: false

springdoc:
  swagger-ui:
    path: /api-test
    enabled: true
  api-docs:
    enabled: true
