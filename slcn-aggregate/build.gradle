dependencies {
    implementation project(':slcn-spec')

    implementation 'org.springframework:spring-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.security:spring-security-crypto'

    // 표지 파생본 WebP 인코더. ImageIO SPI로 등록되며 Linux/aarch64 네이티브를 포함한다.
    // 사용할 수 없는 환경에서는 FileUtils가 JPEG로 폴백하므로 실패해도 기능이 끊기지 않는다.
    implementation 'com.github.usefulness:webp-imageio:0.10.0'

    // S3 호환 오브젝트 스토리지(Cloudflare R2) 클라이언트와 presigner.
    // R2와 S3가 같은 API이므로 endpoint만 바꿔 어느 쪽으로도 전환할 수 있다.
    implementation platform('software.amazon.awssdk:bom:2.54.11')
    implementation 'software.amazon.awssdk:s3'

    // Map Struct
    implementation 'org.mapstruct:mapstruct:1.5.3.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    runtimeOnly 'org.postgresql:postgresql'
}
